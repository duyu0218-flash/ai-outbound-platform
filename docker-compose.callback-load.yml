# Disposable Java/Node synthetic smoke harness; never targets business services.
# Each invocation needs its own Compose project and output directory.
services:
  load:
    image: ${JAVA_LOAD_IMAGE:-outbound-no-python:validation}
    command: ["node", "tools/stack-smoke.mjs"]
    environment:
      JAVA_SERVICES_LOAD: "1"
    volumes:
      - ${JAVA_LOAD_OUTPUT_DIR:?Set a fresh synthetic artifact directory}:/workspace/artifacts/no-python
