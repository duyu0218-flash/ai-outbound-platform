[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-outbound-voice-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn[standard]==0.52.4", "httpx==0.28.1", "pydantic-settings==2.15.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "httpx2==2.12.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
