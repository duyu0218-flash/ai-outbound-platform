# All business service processes are Java. Apply AFTER docker-compose.java.yml.
# Explicit offline cutover only; this file does not stop existing Python processes.
services:
  ai-agent:
    build:
      context: .
      dockerfile: services-java/Dockerfile
    image: ai-outbound-services-java:local
    command: ["java", "-jar", "/app/services.jar"]
    environment:
      JAVA_SERVICE_ROLE: agent
      JAVA_BIND_ADDRESS: 0.0.0.0
      PORT: "8001"
      LLM_QUOTA_DB_PATH: /var/lib/model-quota/account.db
      LLM_QUOTA_SCOPE: ${LLM_QUOTA_SCOPE:-primary-account}
    volumes:
      - model_quota_java:/var/lib/model-quota
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/services.jar", "--healthcheck"]
      timeout: 15s
      start_period: 30s
  recording-adapter:
    build:
      context: .
      dockerfile: services-java/Dockerfile
    image: ai-outbound-services-java:local
    command: ["java", "-jar", "/app/services.jar"]
    environment:
      JAVA_SERVICE_ROLE: recording
      JAVA_BIND_ADDRESS: 0.0.0.0
      PORT: "8003"
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/services.jar", "--healthcheck"]
      timeout: 15s
      start_period: 30s
  voice-gateway:
    build:
      context: .
      dockerfile: services-java/Dockerfile
    image: ai-outbound-services-java:local
    command: ["java", "-jar", "/app/services.jar"]
    environment:
      JAVA_SERVICE_ROLE: voice
      JAVA_BIND_ADDRESS: 0.0.0.0
      PORT: "8002"
      FREESWITCH_RECORDING_DIR: /recordings
    volumes:
      - java_source_recordings:/recordings
    pids_limit: 2048
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/services.jar", "--healthcheck"]
      timeout: 15s
      start_period: 30s
volumes:
  model_quota_java:
  java_source_recordings:
