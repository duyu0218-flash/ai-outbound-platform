  db:
    image: ${POSTGRES_IMAGE:?Set qualified PostgreSQL 16 immutable image}
    restart: unless-stopped
    network_mode: host
    env_file: ${SINGLE500_POSTGRES_ENV_FILE:?Set database credential file}
    command:
    - postgres
    - -c
    - listen_addresses=127.0.0.1
    - -c
    - max_connections=120
    - -c
    - shared_buffers=2GB
    - -c
    - work_mem=8MB
    - -c
    - max_wal_size=4GB
    - -c
    - synchronous_commit=on
    - -c
    - fsync=on
    volumes:
    - postgres_data:/var/lib/postgresql/data
    cpus: 3
    mem_limit: 8g
    shm_size: 1g
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
  redis:
    image: ${REDIS_IMAGE:?Set qualified Redis immutable image}
    restart: unless-stopped
    network_mode: host
    command:
    - sh
    - -c
    - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDISCLI_AUTH"
    volumes:
    - ${SINGLE500_REDIS_CONFIG_FILE:?Set Redis password and persistence config}:/usr/local/etc/redis/redis.conf:ro
    - redis_data:/data
    - ${SINGLE500_REDIS_TLS_DIR:?Set Redis certificate key and CA directory}:/etc/redis/tls:ro
    cpus: 0.5
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - --tls
      - --cacert
      - /etc/redis/tls/ca.crt
      - --sni
      - localhost
      - -h
      - localhost
      - ping
      interval: 5s
      timeout: 3s
      retries: 20
    env_file: ${SINGLE500_REDIS_ENV_FILE:?Set Redis credential file with REDISCLI_AUTH}
volumes:
  voice_security: null
  recording_spool: null
  model_quota: null
  postgres_data: null
  redis_data: null
