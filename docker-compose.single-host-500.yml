# Java Linux single-host qualification candidate. 500 total in-flight is an acceptance target, not measured Java capacity.
# Java workers share leased queues; former Python shard/concurrency settings are not carried over.
services:
  control-api:
    extends:
      file: docker-compose.compact.yml
      service: control-api
    environment:
      DATABASE_POOL_SIZE: '5'
      CALLBACK_INBOX_ENABLED: 'true'
      CALLBACK_INBOX_MIN_WORKERS: '11'
      STABILITY_ADMISSION_ENABLED: 'true'
      STABILITY_MIN_AI_WORKERS: '11'
      REQUEST_ADMISSION_TOTAL_INFLIGHT: '5'
      REQUEST_ADMISSION_WEBHOOK_INFLIGHT: '4'
      REQUEST_ADMISSION_DEFAULT_INFLIGHT: '1'
      AI_AGENT_URL: http://127.0.0.1:8004
      JAVA_BIND_ADDRESS: 127.0.0.1
      PORT: '8010'
      JAVA_WORKERS_ENABLED: 'false'
      JAVA_DISPATCH_ENABLED: 'false'
    command:
    - java
    - -jar
    - /app/control.jar
    healthcheck:
      test:
      - CMD
      - java
      - -jar
      - /app/control.jar
      - --healthcheck
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.25
  control-api-2:
