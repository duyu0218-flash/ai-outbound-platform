# Standalone Linux single-host qualification profile; 500 total in-flight calls, NOT measured capacity.
# Use this file alone; extends imports individual compact services.
services:
  control-api:
    extends:
      file: docker-compose.compact.yml
      service: control-api
    environment:
      DATABASE_POOL_SIZE: '6'
      REQUEST_ADMISSION_TOTAL_INFLIGHT: '6'
      REQUEST_ADMISSION_WEBHOOK_INFLIGHT: '5'
      REQUEST_ADMISSION_DEFAULT_INFLIGHT: '1'
      AI_AGENT_URL: http://127.0.0.1:8004
    command:
    - uvicorn
    - app.main:app
    - --host
    - 127.0.0.1
    - --port
    - '8010'
    - --workers
    - '1'
    - --no-access-log
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/readyz',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: 0.75
