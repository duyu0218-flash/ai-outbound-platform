# Optional isolated native PBX/PCM fixture; never use it as the business gateway.
services:
  freeswitch-media:
    image: ai-freeswitch-voismart-java:2.5.1
    build:
      context: .
      dockerfile: deploy/freeswitch-voismart/Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    tmpfs: ["/tmp:rw,nosuid,size=256m,uid=10001,gid=10001"]
    environment:
      MEDIA_ESL_ALLOWED_CIDR: ${MEDIA_ESL_ALLOWED_CIDR:?Set the exact private Docker project subnet}
    volumes:
      - ./deploy/freeswitch-voismart/freeswitch.xml:/opt/media-config/freeswitch.xml:ro
      - media_test_recordings:/recordings
    secrets: [voismart_esl_password]
    expose: ["8021"]
    healthcheck:
      test: ["CMD", "java", "-cp", "/opt/media-tools", "Pbx", "health"]
      interval: 10s
      timeout: 5s
      retries: 12
  media-probe:
    image: node:22-bookworm-slim
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    working_dir: /workspace
    tmpfs: ["/tmp:rw,nosuid,size=64m,uid=10001,gid=10001"]
    environment:
      ENV: test
      FREESWITCH_ESL_HOST: freeswitch-media
    command: ["node", "tools/media-probe.mjs", "--serve"]
    volumes:
      - ./tools:/workspace/tools:ro
      - media_test_recordings:/recordings:ro
    secrets: [voismart_esl_password]
    ports: ["127.0.0.1:18002:8002"]
    depends_on:
      freeswitch-media:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
secrets:
  voismart_esl_password:
    file: ./.secrets/voismart-esl-password
volumes:
  media_test_recordings:
