worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 4096; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 64m;
    upstream control_api {
        zone control_api 64k;
        least_conn;
        server 127.0.0.1:8010 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8011 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8012 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8013 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8014 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8015 max_fails=2 fail_timeout=5s;
        keepalive 64;
    }
    server {
        listen 127.0.0.1:8000;
        # Scrape every process independently; /metrics through least_conn
        # alone would sample only one process and corrupt aggregate counters.
        location = /internal/metrics/api/1 {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8010/metrics/runtime;
            proxy_set_header Host $http_host;
            proxy_next_upstream off;
        }
        # Scrape every process independently; /metrics through least_conn
        # alone would sample only one process and corrupt aggregate counters.
        location = /internal/metrics/api/2 {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8011/metrics/runtime;
            proxy_set_header Host $http_host;
            proxy_next_upstream off;
        }
        # Scrape every process independently; /metrics through least_conn
        # alone would sample only one process and corrupt aggregate counters.
        location = /internal/metrics/api/3 {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8012/metrics/runtime;
            proxy_set_header Host $http_host;
            proxy_next_upstream off;
        }
        # Scrape every process independently; /metrics through least_conn
        # alone would sample only one process and corrupt aggregate counters.
        location = /internal/metrics/api/4 {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8013/metrics/runtime;
            proxy_set_header Host $http_host;
            proxy_next_upstream off;
        }
        location = /internal/metrics/api/5 {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8014/metrics/runtime;
            proxy_set_header Host $http_host;
            proxy_next_upstream off;
        }
        location = /internal/metrics/api/6 {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:8015/metrics/runtime;
            proxy_set_header Host $http_host;
            proxy_next_upstream off;
        }
        location / {
            proxy_pass http://control_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 2s;
            # A timed-out POST may already have committed; retry at caller with
            # its original event/idempotency identifier, never inside the proxy.
            proxy_next_upstream off;
        }
    }
    upstream model_agent {
        zone model_agent 64k;
        least_conn;
        server 127.0.0.1:8025 max_fails=2 fail_timeout=5s;
        server 127.0.0.1:8026 max_fails=2 fail_timeout=5s;
        keepalive 128;
    }
    server {
        listen 127.0.0.1:8004;
        location / {
            proxy_pass http://model_agent;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 15s;
            proxy_connect_timeout 1s;
            proxy_next_upstream off;
        }
    }
}
