groups:
  - name: ai-outbound-commercial-readiness
    rules:
      - alert: AiOutboundVoiceGatewayUnavailable
        expr: ai_outbound_voice_gateway_ready == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Voice gateway is not ready
      - alert: AiOutboundMetricsTargetUnavailable
        expr: up{job=~"control-api|voice-gateway|recording-adapter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A required AI outbound metrics target is unavailable
      - alert: AiOutboundDeadTasks
        expr: ai_outbound_tasks{state="dead"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Durable tasks exhausted all retries
      - alert: AiOutboundRecordingDeletionFailures
        expr: ai_outbound_recording_deletion_failures > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Expired recordings could not be deleted
      - alert: AiOutboundRecordingIngestionFailures
        expr: ai_outbound_recording_ingestion_failures > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Provider recordings could not be copied to managed storage
      - alert: AiOutboundRecordingAdapterFailures
        expr: increase(ai_outbound_recording_adapter_ingest_total{result!="success"}[15m]) > 0 or increase(ai_outbound_recording_adapter_delete_total{result!="success"}[15m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Managed recording adapter reported ingestion or deletion failures
      - alert: AiOutboundLockedAccounts
        expr: ai_outbound_locked_users > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: One or more accounts remain locked
      - alert: AiOutboundVoiceEmergencyStop
        expr: ai_outbound_voice_security_stopped > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Voice gateway emergency stop is active
      - alert: AiOutboundVoiceCallbackFailure
        expr: ai_outbound_voice_security_oldest_callback_age_sec >= 30
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Voice callbacks are failing; new real calls must stop
      - alert: AiOutboundVoicePolicyRejections
        expr: increase(ai_outbound_voice_security_rejected_commands[5m]) >= 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Repeated voice policy or budget rejections require investigation
