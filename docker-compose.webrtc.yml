services:
  control-api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBRTC_ENABLED: "true"
      WEBRTC_WSS_URL: ${WEBRTC_WSS_URL:?Set WEBRTC_WSS_URL to the public wss endpoint}
      WEBRTC_SIP_DOMAIN: ${WEBRTC_SIP_DOMAIN:?Set WEBRTC_SIP_DOMAIN}
      TURN_URLS: ${TURN_URLS:?Set TURN_URLS}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET}
      FREESWITCH_DIRECTORY_TOKEN: ${FREESWITCH_DIRECTORY_TOKEN:?Set FREESWITCH_DIRECTORY_TOKEN}

  voice-gateway:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      VOICE_GATEWAY_DRIVER: freeswitch_esl
      FREESWITCH_ESL_HOST: host.docker.internal
      FREESWITCH_ESL_PORT: 8021

  coturn:
    image: coturn/coturn:4.17.2-r0
    container_name: ai-outbound-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET}
      - --realm=${TURN_REALM:?Set TURN_REALM}
      - --external-ip=${PUBLIC_IPV4:?Set PUBLIC_IPV4}
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=${TURN_MIN_PORT:-49152}
      - --max-port=${TURN_MAX_PORT:-55000}
      - --cert=/tls/fullchain.pem
      - --pkey=/tls/privkey.pem
      - --no-multicast-peers
      - --stale-nonce=600
      - --total-quota=${TURN_TOTAL_QUOTA:-2000}
      - --user-quota=${TURN_USER_QUOTA:-4}
      - --prometheus
      - --no-cli
    volumes:
      - ${TLS_CERT_FILE:?Set TLS_CERT_FILE}:/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE:?Set TLS_KEY_FILE}:/tls/privkey.pem:ro

  freeswitch:
    image: ${FREESWITCH_IMAGE:?Set FREESWITCH_IMAGE to a pinned and audited image digest}
    container_name: ai-outbound-freeswitch
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${FREESWITCH_CONFIG_DIR:?Set FREESWITCH_CONFIG_DIR}:/etc/freeswitch:ro
      - ${FREESWITCH_RECORDING_DIR:-./data/recordings}:/var/lib/freeswitch/recordings
      - ${FREESWITCH_WSS_PEM:?Set FREESWITCH_WSS_PEM to certificate chain plus private key}:/etc/freeswitch/tls/wss.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -x status | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:1.28.0-alpine
    container_name: ai-outbound-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/nginx/ai-outbound.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:?Set TLS_CERT_FILE}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_FILE:?Set TLS_KEY_FILE}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      control-api:
        condition: service_healthy
