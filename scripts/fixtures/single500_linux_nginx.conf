worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
    access_log off;
    upstream control_api {
        zone control_api 64k;
        least_conn;
        server 127.0.0.1:18910;
        server 127.0.0.1:18911;
        server 127.0.0.1:18912;
        server 127.0.0.1:18913;
        server 127.0.0.1:18914;
        server 127.0.0.1:18915;
        keepalive 64;
    }
    server {
        listen 127.0.0.1:18900;
        location / {
            proxy_pass http://control_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 2s;
            proxy_next_upstream off;
        }
    }
}
