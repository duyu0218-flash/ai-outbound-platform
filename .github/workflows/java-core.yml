name: java-core
on:
  push:
    branches: [main, feat/java-core-backend-20261015, migration/java-services-20261017, migration/no-python-toolchain-20261017]
  pull_request:
    branches: [main]
jobs:
  java17:
    runs-on: ubuntu-latest
    container: maven:3.9.11-eclipse-temurin-17
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: java_core_test
          POSTGRES_USER: java_test
          POSTGRES_PASSWORD: isolated-ci-test-password
        options: >-
          --health-cmd "pg_isready -U java_test -d java_core_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JAVA_TEST_DATABASE_URL: ${{ matrix.database == 'postgresql' && 'jdbc:postgresql://postgres:5432/java_core_test' || 'jdbc:sqlite:file:java-auth-test?mode=memory&cache=shared' }}
      DATABASE_USER: java_test
      DATABASE_PASSWORD: isolated-ci-test-password
      JAVA_TEST_REDIS_URL: redis://redis:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Compile and test with JDK 17
        run: bash backend-java/scripts/build-java17.sh -B verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java17-${{ matrix.database }}-tests
          path: backend-java/target/surefire-reports/
  java-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test fail-closed security report validation
        run: node --test tools/tests/security-check.test.mjs
      - name: SBOM, OSV dependencies and FindSecBugs analysis
        run: bash backend-java/scripts/security-check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java17-security-reports
          if-no-files-found: error
          path: |
            backend-java/target/java-dependencies.cdx.json
            backend-java/target/osv.json
            backend-java/target/spotbugsXml.xml
            backend-java/target/security-summary.json
  java-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: Build Java runtime image and frontend
        run: docker build -f backend-java/Dockerfile -t java-core-ci .
      - name: Verify disposable Java image and all HTTP boundaries
        run: node tools/container-smoke.mjs --role core --image java-core-ci
      - name: Preserve container diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-core-container-validation
          path: artifacts/no-python/
