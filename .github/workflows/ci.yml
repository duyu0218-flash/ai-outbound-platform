name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, agent]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        if: matrix.service == 'backend'
        with:
          node-version: "22"
      - name: Enable pnpm
        if: matrix.service == 'backend'
        working-directory: frontend
        run: corepack enable
      - name: Install frontend
        if: matrix.service == 'backend'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        if: matrix.service == 'backend'
        working-directory: frontend
        run: pnpm build
      - name: Install service
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then
            pip install --no-cache-dir ".[dev]"
          else
            pip install --no-cache-dir .
          fi
      - name: Compile check
        run: |
          mkdir -p /tmp/pycache
          PYTHONPYCACHEPREFIX=/tmp/pycache python -m compileall app
      - name: Backend tests
        if: matrix.service == 'backend'
        env:
          ENV: development
          DATABASE_URL: sqlite:////tmp/ai-outbound-ci.db
          REDIS_URL: ""
          RATE_LIMIT_ENABLED: "false"
          TELEPHONY_PROVIDER: mock
          AI_AGENT_URL: http://127.0.0.1:8001
        run: pytest -q tests
