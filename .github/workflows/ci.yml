name: ci
on:
  push:
    branches: [main, migration/no-python-toolchain-20261017]
  pull_request:
    branches: [main]
jobs:
  frontend-and-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source, frozen contracts, Compose and all tooling regressions
        run: |
          node tools/check-toolchain.mjs
          node --test tools/tests/*.test.mjs
          node tools/verify-contracts.mjs
          node tools/verify-compose.mjs
      - name: Frontend build, coverage and dependency audit
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test:coverage
          pnpm audit --audit-level low
  clean-no-python:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Build clean JDK/Node/Maven/browser environment without interpreter installation
        run: docker build -f tools/Dockerfile --target browser -t outbound-no-python:ci .
      - name: Actual Java, PostgreSQL, Redis, S3, tools and browser acceptance
        run: node tools/clean-environment.mjs --image outbound-no-python:ci --browser
      - name: Preserve clean-environment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: no-python-clean-acceptance
          path: artifacts/no-python/
          if-no-files-found: error
  deployable-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate shell and native configuration
        run: |
          sh -n scripts/bootstrap-deployment-secrets.sh
          sh -n scripts/run-sipp-acceptance.sh
          ./scripts/bootstrap-deployment-secrets.sh
          docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.observability.yml config --quiet
          docker compose -f docker-compose.sipp.yml config --quiet
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            -v "$PWD/.secrets/metrics_token:/run/secrets/metrics_token:ro" \
            prom/prometheus:v3.14.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/amtool \
            -v "$PWD/deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.34.0 check-config /etc/alertmanager/alertmanager.yml
      - name: Build the pinned SIPp native test image
        run: |
          docker compose -f docker-compose.sipp.yml build sipp
          docker run --rm ai-outbound-sipp:3.7.7 -v | grep "SIPp v3.7.7"
