name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, agent]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        if: matrix.service == 'backend'
        with:
          node-version: "22"
      - name: Enable pnpm
        if: matrix.service == 'backend'
        working-directory: frontend
        run: corepack enable
      - name: Install frontend
        if: matrix.service == 'backend'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        if: matrix.service == 'backend'
        working-directory: frontend
        run: pnpm build
      - name: Install service
        run: pip install --no-cache-dir ".[dev]"
      - name: Compile check
        run: |
          mkdir -p /tmp/pycache
          PYTHONPYCACHEPREFIX=/tmp/pycache python -m compileall app
      - name: Verify packaged frontend
        if: matrix.service == 'backend'
        run: |
          python -c "from app.api.routers.pages import INDEX_FILE; assert INDEX_FILE.is_file(), f'missing packaged frontend: {INDEX_FILE}'"
      - name: Service tests
        env:
          ENV: development
          DATABASE_URL: sqlite:////tmp/ai-outbound-ci.db
          REDIS_URL: ""
          RATE_LIMIT_ENABLED: "false"
          TELEPHONY_PROVIDER: mock
          AI_AGENT_URL: http://127.0.0.1:8001
        run: pytest -q tests
