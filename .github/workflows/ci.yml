name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  version-constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate version constraints and compatibility matrix
        run: python scripts/check-version-constraints.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, agent, voice_gateway]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        if: matrix.service == 'backend'
        with:
          node-version: "22"
      - name: Enable pnpm
        if: matrix.service == 'backend'
        working-directory: frontend
        run: corepack enable
      - name: Install frontend
        if: matrix.service == 'backend'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        if: matrix.service == 'backend'
        working-directory: frontend
        run: pnpm build
      - name: Test frontend with coverage
        if: matrix.service == 'backend'
        working-directory: frontend
        run: pnpm test:coverage
      - name: Install service
        run: pip install --no-cache-dir ".[dev]"
      - name: Verify Python dependencies
        run: pip check
      - name: Compile check
        run: |
          mkdir -p /tmp/pycache
          PYTHONPYCACHEPREFIX=/tmp/pycache python -m compileall app
      - name: Verify packaged frontend
        if: matrix.service == 'backend'
        run: |
          python -c "from app.api.routers.pages import INDEX_FILE; assert INDEX_FILE.is_file(), f'missing packaged frontend: {INDEX_FILE}'"
      - name: Service tests
        env:
          ENV: development
          DATABASE_URL: sqlite:////tmp/ai-outbound-ci.db
          REDIS_URL: ""
          RATE_LIMIT_ENABLED: "false"
          TELEPHONY_PROVIDER: mock
          AI_AGENT_URL: http://127.0.0.1:8001
        run: pytest -q tests

  postgres-redis-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_outbound
          POSTGRES_USER: ai_user
          POSTGRES_PASSWORD: integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_user -d ai_outbound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
        working-directory: frontend
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install backend
        run: pip install --no-cache-dir ".[dev]"
      - name: Verify packaged frontend
        run: |
          python -c "from app.api.routers.pages import INDEX_FILE; assert INDEX_FILE.is_file(), f'missing packaged frontend: {INDEX_FILE}'"
      - name: Test backend against PostgreSQL and Redis
        env:
          ENV: test
          DATABASE_URL: postgresql+psycopg://ai_user:integration-password@127.0.0.1:5432/ai_outbound
          REDIS_URL: redis://127.0.0.1:6379/0
          RATE_LIMIT_ENABLED: "false"
          DEMO_USERS_ENABLED: "true"
          SCHEDULER_ENABLED: "false"
        run: |
          pytest -q tests
          python -m app.migration_runner
          python -m app.migration_runner | grep "none"
          python -c "from app.services.health import db_health_check, redis_health_check; assert db_health_check() == 'ok'; assert redis_health_check() == 'ok'"

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install frontend and browser
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Build and start Compose stack
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example up -d --build
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Browser acceptance
        working-directory: frontend
        run: pnpm test:e2e
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes
