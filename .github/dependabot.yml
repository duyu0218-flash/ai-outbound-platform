version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:15"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directories:
      - "/backend-java"
      - "/services-java"
      - "/deploy/sipp"
      - "/tools"
      - "/deploy/freeswitch-voismart"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10

  - package-ecosystem: "maven"
    directories:
      - "/backend-java"
      - "/services-java"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:35"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:45"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
