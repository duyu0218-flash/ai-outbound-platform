version: 2

updates:
  - package-ecosystem: "pip"
    directories:
      - "/backend"
      - "/agent"
      - "/voice_gateway"
      - "/recording_adapter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:15"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/backend"
      - "/agent"
      - "/voice_gateway"
      - "/recording_adapter"
      - "/deploy/sipp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:45"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
