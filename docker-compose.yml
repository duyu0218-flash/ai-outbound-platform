services:
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: ai-outbound-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-replace-redis-password}"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-replace-redis-password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ai-outbound-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_outbound
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-db-password}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_outbound"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  control-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: ai-outbound-control
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.example}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      voice-gateway:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ai_user:${POSTGRES_PASSWORD:-replace-db-password}@db:5432/ai_outbound
      REDIS_URL: redis://:${REDIS_PASSWORD:-replace-redis-password}@redis:6379/0
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-http}
      TELEPHONY_PROVIDER_ENDPOINT: ${TELEPHONY_PROVIDER_ENDPOINT:-http://voice-gateway:8002}
      TELEPHONY_SERVICE_TOKEN: ${TELEPHONY_SERVICE_TOKEN:-}
      AI_AGENT_SERVICE_TOKEN: ${AI_AGENT_SERVICE_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3); print('ok')"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${CONTROL_API_WORKERS:-2}", "--timeout-keep-alive", "15", "--log-level", "info"]

  ai-agent:
    build:
      context: ./agent
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: ai-outbound-agent
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.example}
    environment:
      AI_CONTROL_URL: http://control-api:8000
      SERVICE_TOKEN: ${AI_AGENT_SERVICE_TOKEN:-}
    expose:
      - "8001"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3); print('ok')"]
      interval: 10s
      timeout: 5s
      retries: 20

  voice-gateway:
    build:
      context: .
      dockerfile: voice_gateway/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    container_name: ai-outbound-voice-gateway
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.example}
    environment:
      VOICE_GATEWAY_DRIVER: ${VOICE_GATEWAY_DRIVER:-mock}
      WEBHOOK_TOKEN: ${TELEPHONY_WEBHOOK_TOKEN:-}
      SERVICE_TOKEN: ${TELEPHONY_SERVICE_TOKEN:-}
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/readyz', timeout=3); print('ok')"]
      interval: 10s
      timeout: 5s
      retries: 20

  # FreeSWITCH should be deployed from a pinned, audited release and exposed to
  # this private network through ESL. Do not use an unpinned `latest` image.
  # Set VOICE_GATEWAY_DRIVER=freeswitch_esl and FREESWITCH_ESL_* in the env file.

volumes:
  postgres_data:
