server.address=${JAVA_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:18000}
server.error.include-message=never
server.shutdown=graceful
spring.datasource.url=${JAVA_DATABASE_URL:jdbc:sqlite:./.local/control.db}
spring.datasource.username=${DATABASE_USER:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=5000
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jackson.serialization.write-dates-as-timestamps=false
spring.web.resources.static-locations=file:${FRONTEND_STATIC_DIR:../backend/app/static}/
spring.mvc.throw-exception-if-no-handler-found=true
