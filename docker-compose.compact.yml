    env_file: ${COMPACT_VOICE_ENV_FILE:?Set voice secrets/config file}
    environment:
      ENV: production
      VOICE_NODE_ID: ${NODE_ID:?Set unique roster node ID}
      VOICE_GATEWAY_DRIVER: freeswitch_esl
      VOICE_AI_PIPELINE: pipecat
      VOICE_MAX_CONCURRENT: '200'
      PIPECAT_MAX_ACTIVE_SESSIONS: '200'
      VOICE_CALLBACK_CONCURRENCY: '32'
      VOICE_CALLBACK_POLL_SEC: '0.05'
      VOICE_SECURITY_DB_PATH: /var/lib/voice-security/ledger.db
      VOICE_SECURITY_ROUTES_FILE: /etc/compact/voice-routes.json
      FREESWITCH_ESL_HOST: 127.0.0.1
      FREESWITCH_RECORDING_DIR: /var/lib/freeswitch/recordings
      VOICE_RECORDING_SOURCE_BASE_URL: http://${NODE_PRIVATE_IP}:8002
      PIPECAT_MEDIA_WS_BASE: ws://127.0.0.1:8101/v1/pipecat/media
      MEDIA_RPC_TOKEN: ${MEDIA_RPC_TOKEN:?Set the same independent 32+ character RPC token on this host}
      MEDIA_WORKERS_JSON: '[{"id":"media-1","endpoint":"http://127.0.0.1:8101","ws_base":"ws://127.0.0.1:8101/v1/pipecat/media","capacity":50},{"id":"media-2","endpoint":"http://127.0.0.1:8102","ws_base":"ws://127.0.0.1:8102/v1/pipecat/media","capacity":50},{"id":"media-3","endpoint":"http://127.0.0.1:8103","ws_base":"ws://127.0.0.1:8103/v1/pipecat/media","capacity":50},{"id":"media-4","endpoint":"http://127.0.0.1:8104","ws_base":"ws://127.0.0.1:8104/v1/pipecat/media","capacity":50}]'
      JAVA_SERVICE_ROLE: voice
      JAVA_BIND_ADDRESS: 0.0.0.0
      PORT: '8002'
    volumes:
    - voice_security:/var/lib/voice-security
    - ${COMPACT_ROUTES_FILE:?Set independently approved tenant/line policies}:/etc/compact/voice-routes.json:ro
    - ${FREESWITCH_RECORDING_DIR:?Set node-local recording path}:/var/lib/freeswitch/recordings
    cpus: 1
    mem_limit: 2g
    stop_grace_period: 30s
    command:
    - java
    - -jar
    - /app/services.jar
