# Canonical Java Linux host-network candidate; use immutable backend-java/services-java image digests.
# No capacity claim. Required TLS truststore and operator secrets are not provisioned by Compose.
services:
  control-api:
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 1024
    tmpfs:
    - /tmp:rw
    - nosuid
    - size=256m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    image: ${CONTROL_IMAGE:?Set the same immutable control image on all nodes}
    env_file: ${COMPACT_BACKEND_ENV_FILE:?Set backend secrets/config file}
    environment:
      ENV: production
      AUTO_MIGRATE: 'false'
      DEMO_USERS_ENABLED: 'false'
      VOICE_GATEWAY_NODES_FILE: /etc/compact/nodes.json
      OUTBOUND_PLATFORM_MAX_CONCURRENT: '500'
      MAX_CONCURRENT_CALLS: '500'
      TERMINAL_ANALYSIS_ASYNC: 'true'
      AI_AGENT_URL: http://127.0.0.1:8001
      DATABASE_POOL_SIZE: '4'
      DATABASE_MAX_OVERFLOW: '0'
      RECORDING_INGEST_ENDPOINT: http://127.0.0.1:8003/v1/recordings/ingest
      RECORDING_DELETE_ENDPOINT: http://127.0.0.1:8003/v1/recordings/delete
      REQUEST_ADMISSION_TOTAL_INFLIGHT: '4'
      REQUEST_ADMISSION_WEBHOOK_INFLIGHT: '3'
      REQUEST_ADMISSION_DEFAULT_INFLIGHT: '1'
      REQUEST_ADMISSION_MAX_WAITERS: '8'
      REQUEST_ADMISSION_TIMEOUT_SEC: '0.05'
      JAVA_BIND_ADDRESS: 127.0.0.1
      PORT: '8010'
      JAVA_INITIALIZE_SCHEMA: 'false'
      JAVA_RELEASE_ACCEPTED: ${JAVA_RELEASE_ACCEPTED:-false}
      JAVA_WORKERS_ENABLED: 'false'
      CALLBACK_INBOX_ENABLED: 'true'
      CALLBACK_INBOX_MIN_WORKERS: ${JAVA_CALLBACK_MIN_WORKERS:-12}
      STABILITY_ADMISSION_ENABLED: 'true'
      STABILITY_MIN_AI_WORKERS: ${JAVA_STABILITY_MIN_WORKERS:-12}
      JAVA_DISPATCH_ENABLED: 'false'
      FRONTEND_STATIC_DIR: /app/static
    volumes:
    - ${COMPACT_NODES_FILE:?Set the identical operator roster on all nodes}:/etc/compact/nodes.json:ro
    - ${JAVA_TRUSTSTORE_FILE:?Set Java truststore containing Redis CA}:/etc/java/redis-truststore.p12:ro
    cpus: 1
    mem_limit: 1g
    command:
    - java
    - -jar
    - /app/control.jar
    healthcheck:
      test:
      - CMD
      - java
      - -jar
      - /app/control.jar
      - --healthcheck
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 5
