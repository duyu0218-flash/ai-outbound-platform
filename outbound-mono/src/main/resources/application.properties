spring.application.name=outbound-mono
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.url=${MYSQL_JDBC_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.druid.initial-size=0
spring.datasource.druid.min-idle=0
spring.datasource.druid.max-active=4
spring.datasource.druid.stat-view-servlet.enabled=true
spring.datasource.druid.stat-view-servlet.reset-enable=false
spring.flyway.enabled=true
# Flyway uses a dedicated migration connection, separate from the Druid business pool.
spring.flyway.url=${FLYWAY_JDBC_URL:${MYSQL_JDBC_URL}}
spring.flyway.user=${FLYWAY_USER:${MYSQL_USER}}
spring.flyway.password=${FLYWAY_PASSWORD:${MYSQL_PASSWORD}}
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-handlers-package=com.duozhi.outbound.mapper.typehandler
mybatis.configuration.call-setters-on-nulls=true
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.ai.model.chat=${AI_CHAT_MODEL:none}
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
spring.ai.openai.base-url=${OPENAI_BASE_URL:}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# PostgreSQL SERIAL accepts an explicit zero; callback partition zero must survive MySQL AUTO_INCREMENT.
spring.datasource.druid.connection-init-sqls[0]=SET SESSION sql_mode = CONCAT(@@SESSION.sql_mode, ",NO_AUTO_VALUE_ON_ZERO")

# Preserve the source CSV upload boundary; application-level CSV checks still apply.
spring.servlet.multipart.max-file-size=${CONTACT_IMPORT_MAX_BYTES:20971520}B
spring.servlet.multipart.max-request-size=21MB
