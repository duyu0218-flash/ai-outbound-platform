# Explicit override: docker compose -f docker-compose.yml -f docker-compose.java.yml ...
# Use only after backup, offline migration and release acceptance.
services:
  control-api:
    build:
      context: .
      dockerfile: backend-java/Dockerfile
    environment:
      JAVA_DATABASE_URL: jdbc:postgresql://db:5432/ai_outbound
      DATABASE_USER: ai_user
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-replace-db-password}
      JAVA_INITIALIZE_SCHEMA: "false"
      JAVA_BIND_ADDRESS: 0.0.0.0
      PORT: "8000"
      FRONTEND_STATIC_DIR: /app/static
      JAVA_WORKERS_ENABLED: "true"
      JAVA_DISPATCH_ENABLED: "true"
      JAVA_RELEASE_ACCEPTED: ${JAVA_RELEASE_ACCEPTED:-false}
      AI_AGENT_URL: http://ai-agent:8001
    command: ["java", "-jar", "/app/control.jar"]
    healthcheck:
      test: ["CMD", "java", "-jar", "/app/control.jar", "--healthcheck"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s
  task-worker:
    # Old Python worker must be stopped before switching ownership of the queue.
    profiles: [legacy-python-core]
