services:
  control-api:
    environment:
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1},control-api
    secrets:
      - metrics_token

  voice-gateway:
    environment:
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets:
      - metrics_token

  recording-adapter:
    environment:
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
    secrets:
      - metrics_token

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-ai-outbound}-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    depends_on:
      control-api:
        condition: service_healthy
      voice-gateway:
        condition: service_healthy
      recording-adapter:
        condition: service_healthy
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.0}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-ai-outbound}-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:-./deploy/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.2.0}
    container_name: ${COMPOSE_CONTAINER_PREFIX:-ai-outbound}-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    secrets:
      - grafana_admin_password

secrets:
  metrics_token:
    file: ${METRICS_TOKEN_FILE:-.secrets/metrics_token}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-.secrets/grafana_admin_password}

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
